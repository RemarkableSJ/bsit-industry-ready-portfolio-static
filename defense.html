<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Defense Mode · BSIT Portfolio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/upgrade.css"><link rel="stylesheet" href="assets/css/portfolio-theme.css"></head><body class="defense-body"><header class="defense-header"><a href="index.html">IT<span>.</span> <small>PROJECT DEFENSE MODE</small></a><div><span>Suggested duration: based on your presentation plan</span><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme"><span class="theme-icon">☾</span><span class="theme-label">Dark mode</span></button><button type="button" onclick="window.print()">Print / Save PDF</button><a href="index.html#employability">Exit</a></div></header><main class="defense-stage"><div class="defense-progress"><span id="progressBar"></span></div><div class="defense-counter"><span id="slideCounter">01 / 01</span><span>BSIT INDUSTRY-READY PORTFOLIO</span></div><section id="defenseSlide" class="defense-slide"><p>Loading defense plan…</p></section><div class="defense-controls"><button type="button" id="prevSlide" disabled>← Previous</button><div><span id="slideStepName">Introduction</span><small>Use ← → arrow keys to navigate</small></div><button type="button" id="nextSlide">Next step →</button></div></main><script src="assets/js/default-data.js"></script><script>
const STEPS=window.defaultPortfolio?.defensePlan||[];const PROFILE=window.defaultPortfolio?.profile||{};const PROJECT=window.defaultPortfolio?.projects?.[0]||{};let current=0;const slide=document.getElementById('defenseSlide'),counter=document.getElementById('slideCounter'),bar=document.getElementById('progressBar'),prev=document.getElementById('prevSlide'),next=document.getElementById('nextSlide'),stepName=document.getElementById('slideStepName');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){const total=STEPS.length;if(!total){slide.innerHTML='<h1>No defense steps yet</h1><p>Add steps in data/portfolio.json.</p>';return;}const item=STEPS[current];counter.textContent=String(current+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');bar.style.width=((current+1)/total*100)+'%';stepName.textContent=item?.step||'Project defense';slide.innerHTML=`<p class="eyebrow">FINAL PROJECT DEFENSE · STEP ${String(current+1).padStart(2,'0')}</p><span class="defense-number">${String(current+1).padStart(2,'0')}</span><h1>${esc(item?.step||'Presentation step')}</h1><p class="defense-duration">Suggested time: ${esc(item?.duration||'As needed')}</p><div class="defense-speaker-note"><strong>Presenter</strong><span>${esc(PROFILE.name||'Portfolio owner')}</span><strong>Featured project</strong><span>${esc(PROJECT.title||'Select a project')}</span></div><div class="defense-content-grid"><article><h2>Talking points</h2><p>${esc(item?.talkingPoints||'Add your talking points in data/portfolio.json.')}</p></article><article><h2>What to demonstrate</h2><p>${esc(item?.demonstration||'Add your real system demonstration.')}</p></article></div><p class="defense-tip">Explain your own contribution, testing, limitations, and how you verified the results. Do not claim features that are not implemented.</p>`;prev.disabled=current===0;next.textContent=current===total-1?'Back to beginning ↺':'Next step →';}prev.addEventListener('click',()=>{current=Math.max(0,current-1);render()});next.addEventListener('click',()=>{current=current===STEPS.length-1?0:current+1;render()});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){current=Math.min(STEPS.length-1,current+1);render()}if(e.key==='ArrowLeft'){current=Math.max(0,current-1);render()}});render();</script><script src="assets/js/theme.js"></script></body></html>
