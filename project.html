<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2b">
  <title>Project Case Study | BSIT Portfolio</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/upgrade.css"><link rel="stylesheet" href="assets/css/portfolio-theme.css">
</head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">IT<span>.</span></span><span class="brand-name">INDUSTRY-READY <small>BSIT PROFESSIONAL PORTFOLIO</small></span></a><nav class="main-nav"><a href="index.html#projects">All projects</a><a href="index.html#contact">Contact</a></nav><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme"><span class="theme-icon">☾</span><span class="theme-label">Dark mode</span></button></div></header>
<main class="project-page"><div class="container" id="projectDetails"><p>Loading project…</p></div></main>
<footer class="site-footer"><div class="container footer-inner"><a class="footer-brand" href="index.html">IT<span>.</span></a><p>Project details and evidence from the BSIT Industry-Ready Portfolio.</p><div class="footer-meta"><a href="index.html#projects">Back to portfolio ↑</a></div></div></footer>
<script src="assets/js/default-data.js"></script>
<script>
(() => {
  const root = document.getElementById('projectDetails');
  const q = new URLSearchParams(location.search);
  const id = Number.parseInt(q.get('id') || '0', 10);
  const data = window.defaultPortfolio || {};
  const p = Array.isArray(data.projects) ? data.projects[id] : null;
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const multiline = v => esc(v).replace(/\r?\n/g, '<br>');
  const block = (label, value) => String(value || '').trim() ? `<article class="project-detail-card"><h2>${esc(label)}</h2><p>${multiline(value)}</p></article>` : '';
  const safeLink = (url, label, cls='btn btn-outline-primary') => /^https?:\/\//i.test(String(url||'')) ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>` : '';
  if (!p) { document.title='Project not found · BSIT Portfolio'; root.innerHTML='<div class="project-not-found"><h1>Project not found</h1><a href="index.html#projects">Return to portfolio</a></div>'; return; }
  document.title = `${p.title || 'Project'} · BSIT Portfolio`;
  const fields = [['Problem statement','problem'],['Objectives','objectives'],['Target users','targetUsers'],['Technologies used','technologies'],['System features','features'],['Functional requirements','functionalRequirements'],['Non-functional requirements','nonFunctionalRequirements'],['Existing / proposed system','existingProposedSystem'],['Use cases / UML','useCases'],['Interface design','interfaceDesign'],['System architecture','architecture'],['Database design / ERD','databaseDesign'],['Installation / setup','installation'],['How to use','usage'],['Testing and results','testing'],['Bugs and corrections','bugsAndCorrections'],['Deployment / configuration','deploymentNotes'],['My contribution','developerRole'],['Limitations','limitations'],['Future improvements','futureImprovements']];
  let extra = '';
  let documentationAction = '';
  if (id === 0) {
    documentationAction = '<a class="btn btn-outline-primary" href="documentation/joshua-studio-house-museum.html">Read Project Documentation ↗</a>';
    const pics = [['Anakin Skywalker','Anakin Skywalker Portrait.jpg'],['Paul Atreides','Paul Atreides Portrait.jpg'],['Willy Wonka','Willy Wonka Portrait.jpg'],['Homelander','Homelander Portrait.jpg'],['Nuclear Dawn','Atomic Bomb Explosion - Canvas Painting.jpg'],['Homer in the Hedges','Homer Hiding in Bush - Canvas Painting.jpg'],['Drawing Pencils','Staedtler Mars Lumograph.jpg'],['Artisan Ecobag','Ecobag.jpg']];
    extra = `<section class="project-artwork-preview"><div class="section-intro-row"><div><p class="eyebrow">SELECTED WORKS & PRODUCTS</p><h2>Gallery preview<span class="accent-dot">.</span></h2><p class="project-gallery-intro">A selection of artwork and product photography from the supplied Studio House Museum project files.</p></div></div><div class="artwork-preview-grid">${pics.map(([label,file])=>`<a class="artwork-preview-card" href="project-archives/joshua-studio-house-museum/assets/images/${encodeURIComponent(file)}" target="_blank" rel="noopener"><img src="project-archives/joshua-studio-house-museum/assets/images/${encodeURIComponent(file)}" alt="${esc(label)}" loading="lazy"><span>${esc(label)}</span></a>`).join('')}</div></section><div class="project-detail-card"><h2>Presentation demo</h2><p>This project is a front-end presentation edition. Cart, checkout, and commission interactions are simulated and do not process real orders or payments.</p><a class="btn btn-primary" href="project-archives/joshua-studio-house-museum/index.html" target="_blank" rel="noopener">Open Museum demo ↗</a> ${documentationAction}</div>`;
  } else if (id === 1) {
    extra = `<div class="project-detail-card"><h2>Supporting documents</h2><p><a href="evidence-staging/Project2_TechZone_Final_Report.pdf" target="_blank" rel="noopener">View project report (PDF)</a></p><p><a href="evidence-staging/Project2_TechZone_Analysis_Workbook.xlsx">Download analysis workbook (XLSX)</a></p><p><a href="project-archives/TechZone_Project2_Complete_Source_Package.zip">Download source package (ZIP)</a></p></div>`;
  } else if (id === 2) {
    documentationAction = '<a class="btn btn-outline-primary" href="documentation/buo-app.html">Read Buo Documentation ↗</a>';
    extra = `<section class="project-artwork-preview buo-app-identity"><div class="section-intro-row"><div><p class="eyebrow">APP IDENTITY</p><h2>Buo launcher icon<span class="accent-dot">.</span></h2><p class="project-gallery-intro">The supplied orange lightning-bolt app icon.</p></div></div><div style="max-width:180px;margin:0 auto 2rem;text-align:center"><img src="assets/images/buo-app-icon.png" alt="Buo app icon" style="width:100%;height:auto;border-radius:24px;box-shadow:0 18px 48px rgba(0,0,0,.18)"></div></section><div class="project-detail-card"><h2>Windows desktop source</h2><p>Buo is a desktop application; GitHub Pages displays its documentation and source links but does not run the Kivy application in a browser.</p><a class="btn btn-primary" href="project-archives/Buo_Desktop_Source.zip">Download Buo desktop source ↧</a> ${documentationAction}</div>`;
  }
  const links = `${safeLink(p.liveDemo, 'Live demo', 'btn btn-primary')}${safeLink(p.githubUrl, id === 0 ? 'Browse source files' : 'Download source package')}${id === 1 ? safeLink(p.readmeUrl, 'Project report PDF') : ''}`;
  root.innerHTML = `<a class="back-link" href="index.html#projects">← Back to all projects</a><div class="project-page-hero"><p class="eyebrow">PROJECT ${String(id+1).padStart(2,'0')} / ${esc(p.type || 'IT PROJECT')}</p><span class="status-pill">${esc(p.status || 'In progress')}</span><h1>${esc(p.title || 'Untitled project')}</h1><p>${multiline(p.overview || '')}</p><div class="project-hero-actions">${links}</div></div>${extra}<div class="project-detail-grid">${fields.map(([label,key])=>block(label,p[key])).join('')}</div><section class="project-evidence"><div class="section-intro-row"><div><p class="eyebrow">SUPPORTING FILES</p><h2>Project evidence<span class="accent-dot">.</span></h2></div></div><p class="text-secondary">Supporting files are included in this repository where available. See the project links and documentation above.</p></section>`;
})();
</script><script src="assets/js/theme.js"></script>
</body></html>
